<script>
  window.SHELL_EMBEDDED = {{ 'true' if shell_embedded else 'false' }};

  // ── Per-session state ────────────────────────────────────────────────────────
  const SHELL_STATE = {
    sessions:        [],
    active_sid:      null,
    buffers:         {},
    history:         {},
    histIdx:         {},
    histDraft:       {},
    polling:         false,
    handoffDone:     {},    // sid → true once post-connect steps ran
    profiles:        {},    // sid → resolved handoff profile (cached)
    closing:         new Set(),  // sids being killed (operator) — hide until RPC confirms
    seen:            new Set(),  // every sid ever rendered — handoff fires once per id
    _deadNoted:      new Set(),  // sids we've already printed a death note for (anti-spam)
    _prevSessionIds: [],
    handoffBannerSid: null,
    _handoffQueue:   [],
    _handoffRunning: false,
  };

  const HANDOFF_STABILIZE_MS = 5000;
  const HANDOFF_LAUNCH_TTL_MS = 300000;

  const SHORTCUTS = {
    meterpreter: [
      {label: 'sysinfo',    cmd: 'sysinfo'},
      {label: 'getuid',     cmd: 'getuid'},
      {label: 'getsystem',  cmd: 'getsystem'},
      {label: 'migrate',    cmd: 'migrate -n notepad.exe'},
      {label: 'ps',         cmd: 'ps'},
      {label: 'hashdump',   cmd: 'hashdump',  cls: 'creds'},
      {label: 'kiwi',       cmd: 'load kiwi', cls: 'creds'},
      {label: 'screenshot', cmd: 'screenshot'},
      {label: 'pwd',        cmd: 'pwd'},
      {label: 'background', cmd: 'background', cls: 'danger'},
    ],
    shell: [
      {label: 'whoami',     cmd: 'whoami'},
      {label: 'id',         cmd: 'id'},
      {label: 'uname -a',   cmd: 'uname -a'},
      {label: 'sudo -l',    cmd: 'sudo -l'},
      {label: '/etc/passwd', cmd: 'cat /etc/passwd'},
      {label: '/etc/shadow', cmd: 'cat /etc/shadow', cls: 'creds'},
      {label: 'SUID find',  cmd: 'find / -perm -4000 -type f 2>/dev/null'},
      {label: 'crontab',    cmd: 'crontab -l'},
      {label: 'pwd',        cmd: 'pwd'},
    ],
    powershell: [
      {label: 'whoami',     cmd: 'whoami'},
      {label: 'Get-Process', cmd: 'Get-Process'},
      {label: 'Get-LocalUser', cmd: 'Get-LocalUser'},
      {label: 'systeminfo', cmd: 'systeminfo'},
      {label: 'ipconfig',   cmd: 'ipconfig /all'},
    ],
  };

  function _sessionStype(s) {
    const t = (s.type || '').toLowerCase();
    return t.includes('meter') ? 'meterpreter' : (t || 'shell');
  }

  function isAutoHandoffEnabled() {
    const stored = localStorage.getItem('h3x_autohandoff');
    if (stored === '0') return false;
    if (stored === '1') return true;
    const el = document.querySelector('.h3x-autohandoff-cb');
    return el ? el.checked : true;
  }

  function setAutoHandoff(on) {
    localStorage.setItem('h3x_autohandoff', on ? '1' : '0');
    document.querySelectorAll('.h3x-autohandoff-cb').forEach(el => {
      el.checked = on;
    });
  }

  function _syncAutohandoffCheckboxes() {
    const stored = localStorage.getItem('h3x_autohandoff');
    if (stored === null) return;
    const on = stored === '1';
    document.querySelectorAll('.h3x-autohandoff-cb').forEach(el => {
      el.checked = on;
    });
  }

  function _clearShellArea() {
    const tabs = document.getElementById('session-tabs');
    const bank = document.getElementById('shortcut-bank');
    const term = document.getElementById('shell-term');
    const input = document.getElementById('cmd-input');
    const active = document.getElementById('active-shell');
    const empty = document.getElementById('no-sessions');
    if (tabs) tabs.innerHTML = '';
    if (bank) bank.innerHTML = '';
    if (term) term.textContent = '';
    if (input) input.value = '';
    hideHandoffBanner();
    if (active) active.style.display = 'none';
    if (empty) empty.style.display = '';
  }

  function fetchHandoffProfile(sid) {
    sid = String(sid);
    if (SHELL_STATE.profiles[sid]) return Promise.resolve(SHELL_STATE.profiles[sid]);
    return fetch(`/api/msf/session/${sid}/handoff`)
      .then(r => r.json())
      .then(p => { SHELL_STATE.profiles[sid] = p; return p; })
      .catch(() => null);
  }

  function showHandoffBanner(sid) {
    sid = String(sid);
    SHELL_STATE.handoffBannerSid = sid;
    const banner = document.getElementById('handoff-banner');
    const sub = document.getElementById('handoff-banner-sub');
    if (!banner) return;
    const s = SHELL_STATE.sessions.find(x => String(x.id) === sid);
    const stype = s ? _sessionStype(s) : 'session';
    fetchHandoffProfile(sid).then(profile => {
      if (sub) {
        if (profile && profile.notes) {
          sub.textContent = `[${sid}] ${profile.label || stype} — ${profile.notes}`;
        } else {
          sub.textContent = stype === 'meterpreter'
            ? `[${sid}] migrate → elevate → hashdump → background`
            : `[${sid}] ${stype} session — confirm liveness, run recon`;
        }
      }
      _renderHandoffSteps(sid, profile, stype);
    });
    banner.classList.add('visible');
  }

  // Build handoff step buttons from the resolved profile. Meterpreter gets
  // migrate/getsystem/hashdump/background; cmd shells get confirm + recon.
  function _renderHandoffSteps(sid, profile, stype) {
    const steps = document.querySelector('#handoff-banner .handoff-steps');
    if (!steps) return;
    let html = '';
    if (profile && profile.session_expected === false) {
      html = '<span style="font-size:11px;color:var(--muted)">' +
             'Auxiliary module — no shell. Review output above.</span>';
    } else if (stype === 'meterpreter') {
      html =
        `<button class="handoff-btn primary" onclick="runHandoffStep('migrate -n notepad.exe')">① MIGRATE</button>` +
        `<button class="handoff-btn" onclick="runHandoffStep('getsystem')">② GETSYSTEM</button>` +
        `<button class="handoff-btn creds" onclick="runHandoffStep('hashdump')">③ HASHDUMP</button>` +
        `<button class="handoff-btn" onclick="runHandoffStep('background')">④ BACKGROUND</button>`;
    } else {
      const recon = (profile && profile.recon_cmds) || ['id', 'uname -a', 'sudo -l'];
      html = `<button class="handoff-btn primary" onclick="confirmSession('${sid}')">✓ CONFIRM</button>` +
        recon.slice(0, 4).map(cmd =>
          `<button class="handoff-btn" onclick="runHandoffStep(${JSON.stringify(cmd).replace(/"/g,'&quot;')})">${cmd}</button>`
        ).join('');
    }
    html += `<button class="handoff-btn dismiss" onclick="dismissHandoffBanner()">✕ DISMISS</button>`;
    steps.innerHTML = html;
  }

  function confirmSession(sid) {
    sid = String(sid);
    appendBuffer(sid, '\n[handoff] confirming session liveness...\n', 'meta');
    renderTerm();
    return fetch(`/api/msf/session/${sid}/confirm`, {method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({timeout: 10})})
      .then(r => r.json())
      .then(d => {
        if (d.alive) {
          appendBuffer(sid, '[handoff] ✓ ' + (d.message || 'alive') + '\n' +
            (d.output ? d.output + '\n' : ''), 'echo');
        } else {
          appendBuffer(sid, '[handoff] ✗ ' + (d.message || 'no response') + '\n', 'stderr');
          if (d.message && /died|does not exist|not valid/i.test(d.message)) {
            _noteSessionDead(sid, d.message);   // note only; msfrpcd list is truth
          }
        }
        renderTerm();
        return d.alive;
      })
      .catch(() => false);
  }

  function hideHandoffBanner() {
    SHELL_STATE.handoffBannerSid = null;
    const banner = document.getElementById('handoff-banner');
    if (banner) banner.classList.remove('visible');
  }

  function dismissHandoffBanner() {
    const sid = SHELL_STATE.handoffBannerSid || SHELL_STATE.active_sid;
    if (sid) SHELL_STATE.handoffDone[String(sid)] = true;
    hideHandoffBanner();
  }

  function runCmdOnSession(sid, cmd, timeout) {
    timeout = timeout || 15;
    return fetch(`/api/msf/session/${sid}/run`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({command: cmd, timeout}),
    }).then(r => r.json());
  }

  function _applyCmdResult(sid, cmd, d) {
    if (d.status === 'ok') {
      appendBuffer(sid, (d.output || '') + '\n', 'stdout');
    } else if (d.session_dead) {
      _noteSessionDead(sid, d.message);   // note only; do not drop/suppress
      return false;
    } else {
      appendBuffer(sid, '[ERROR] ' + (d.message || 'unknown') + '\n', 'stderr');
    }
    renderTerm();
    return true;
  }

  function runHandoffStep(cmd) {
    const sid = SHELL_STATE.active_sid;
    if (!sid) return;
    if (SHELL_STATE._deadNoted.has(String(sid))) {
      appendBuffer(sid, '[handoff] session is dead — re-launch the exploit '
        + '(this tab will clear once msfrpcd drops it).\n', 'stderr');
      renderTerm();
      return;
    }
    appendBuffer(sid, '\n[handoff] $ ' + cmd + '\n', 'echo');
    renderTerm();
    runCmdOnSession(sid, cmd, 20).then(d => _applyCmdResult(sid, cmd, d));
  }

  function _getLaunchContext() {
    try {
      const raw = sessionStorage.getItem('h3x_last_launch');
      if (!raw) return null;
      const ctx = JSON.parse(raw);
      if (!ctx || !ctx.ts || Date.now() - ctx.ts > HANDOFF_LAUNCH_TTL_MS) return null;
      return ctx;
    } catch (_) {
      return null;
    }
  }

  function _waitForSessionStable(sid) {
    // Use the backend confirmation pipeline — it picks the right probe per
    // profile (sysinfo for Meterpreter, id for cmd shells) and classifies
    // dead sessions consistently.
    return fetch(`/api/msf/session/${sid}/confirm`, {method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({timeout: 12})})
      .then(r => r.json())
      .then(d => !!d.alive)
      .catch(() => false);
  }

  function _scheduleHandoff(sid) {
    sid = String(sid);
    if (SHELL_STATE.handoffDone[sid] || !isAutoHandoffEnabled()) return;
    if (SHELL_STATE._handoffQueue.includes(sid)) return;
    SHELL_STATE._handoffQueue.push(sid);
    _drainHandoffQueue();
  }

  function _drainHandoffQueue() {
    if (SHELL_STATE._handoffRunning || !SHELL_STATE._handoffQueue.length) return;
    const sid = SHELL_STATE._handoffQueue.shift();
    SHELL_STATE._handoffRunning = true;
    runAutoHandoff(sid).finally(() => {
      SHELL_STATE._handoffRunning = false;
      _drainHandoffQueue();
    });
  }

  function runAutoHandoff(sid) {
    sid = String(sid);
    if (SHELL_STATE.handoffDone[sid] === true || !isAutoHandoffEnabled()) {
      return Promise.resolve();
    }
    if (SHELL_STATE.handoffDone[sid] === 'running') return Promise.resolve();
    SHELL_STATE.handoffDone[sid] = 'running';

    return new Promise(resolve => {
      setTimeout(() => {
        const still = SHELL_STATE.sessions.find(x => String(x.id) === sid);
        // Bail if the session is gone, being killed, or already known dead.
        // (Note-only deaths keep the tab in SHELL_STATE.sessions, so `still`
        // alone is no longer enough — we must also skip _deadNoted sessions or
        // we'd prime a corpse with id/ls.)
        if (!still || SHELL_STATE.closing.has(sid) || SHELL_STATE._deadNoted.has(sid)) {
          SHELL_STATE.handoffDone[sid] = true;
          resolve();
          return;
        }

        selectSession(sid);
        showHandoffBanner(sid);

        fetchHandoffProfile(sid).then(profile => {
          profile = profile || {};
          // Auxiliary / no-session — nothing to hand off.
          if (profile.session_expected === false || !profile.auto_harden) {
            SHELL_STATE.handoffDone[sid] = true;
            resolve();
            return;
          }

          const stype = _sessionStype(still);
          if (stype === 'meterpreter') {
            // Meterpreter: migrate is destructive — only harden once the
            // session confirms stable; skip (don't break it) if it doesn't.
            _waitForSessionStable(sid).then(stable => {
              if (!stable) {
                appendBuffer(sid,
                  '[auto-handoff] session did not confirm — skipping migrate\n', 'stderr');
                renderTerm();
                delete SHELL_STATE.handoffDone[sid];
                resolve();
                return;
              }
              _meterpreterHandoff(sid, profile).finally(() => {
                SHELL_STATE.handoffDone[sid] = true;
                resolve();
              });
            });
          } else {
            // cmd/unix shells: confirm robustly but NEVER abandon a non-dead
            // session — keep it interactive even if the liveness probe is quiet.
            _cmdShellHandoff(sid, profile).finally(() => {
              SHELL_STATE.handoffDone[sid] = true;
              resolve();
            });
          }
        });
      }, HANDOFF_STABILIZE_MS);
    });
  }

  // Meterpreter hardening — migrate (unless launch already did) then background.
  function _meterpreterHandoff(sid, profile) {
    const launchCtx = _getLaunchContext();
    const skipMigrate = (profile.skip_migrate_if_launch_migrated !== false)
                        && !!(launchCtx && launchCtx.auto_migrate !== false);
    const harden = profile.harden_cmds || ['migrate -n notepad.exe', 'background'];
    const steps = skipMigrate
      ? harden.filter(c => !/^migrate/.test(c))
      : harden;

    appendBuffer(sid, skipMigrate
      ? '\n[auto-handoff] launch already migrated — backgrounding only...\n'
      : '\n[auto-handoff] migrate → stable process, then background...\n', 'meta');
    renderTerm();

    let chain = Promise.resolve(true);
    steps.forEach(cmd => {
      chain = chain.then(ok => {
        if (!ok) return false;
        return runCmdOnSession(sid, cmd, 25).then(d => _applyCmdResult(sid, cmd, d));
      });
    });
    return chain.then(ok => {
      if (ok) {
        appendBuffer(sid, '[auto-handoff] complete — session hardened\n', 'echo');
        renderTerm();
      }
    }).catch(() => {
      appendBuffer(sid, '[auto-handoff] failed — use banner buttons manually\n', 'stderr');
      renderTerm();
      delete SHELL_STATE.handoffDone[sid];
    });
  }

  // cmd/unix shells — no migrate. The backend /confirm primes the shell with a
  // sentinel echo + retries (dumb reverse_perl shells answer slowly and don't
  // echo a prompt). We display whatever it gathered, keep the panel interactive,
  // and ONLY drop the session if it is proven dead (RPC error). A quiet shell is
  // NOT a dead shell — the operator can type into it.
  function _cmdShellHandoff(sid, profile) {
    sid = String(sid);
    selectSession(sid);
    _activateShellArea();
    appendBuffer(sid,
      '\n[handoff] confirming shell — priming (dumb reverse shells wake on the '
      + 'first command, this can take a few seconds)...\n', 'meta');
    renderTerm();
    return fetch(`/api/msf/session/${sid}/confirm`, {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({timeout: 12, attempts: 3}),
    }).then(r => r.json()).then(d => {
      if (d.dead) {
        _noteSessionDead(sid, d.message);   // note only; msfrpcd list is truth
        return;
      }
      if (d.output && d.output.trim()) {
        appendBuffer(sid, d.output.trim() + '\n', 'stdout');
      }
      if (d.alive) {
        appendBuffer(sid, '[handoff] ✓ shell confirmed responsive — interactive.\n', 'echo');
      } else {
        appendBuffer(sid, '[handoff] ' + (d.message ||
          'shell attached (unconfirmed) — type a command to wake it.') + '\n', 'meta');
      }
      renderTerm();
      _activateShellArea();
      const input = document.getElementById('cmd-input');
      if (!window.SHELL_EMBEDDED && input) input.focus();
    }).catch(() => {
      // Network/RPC hiccup — keep the session, don't drop it.
      appendBuffer(sid, '[handoff] confirm check failed — shell still attached; '
        + 'type a command.\n', 'meta');
      renderTerm();
      _activateShellArea();
    });
  }

  // Ensure the interactive shell area is visible (hide the empty-state).
  function _activateShellArea() {
    const empty  = document.getElementById('no-sessions');
    const active = document.getElementById('active-shell');
    if (empty)  empty.style.display = 'none';
    if (active) active.style.display = '';
  }

  function _onNewSessions(fresh) {
    if (!fresh.length) return;

    // Primary = newest Meterpreter if any (richest handoff), else newest shell.
    const meterFresh = fresh.filter(s => _sessionStype(s) === 'meterpreter');
    const primary = meterFresh.length
      ? meterFresh[meterFresh.length - 1]
      : fresh[fresh.length - 1];
    const primarySid = String(primary.id);

    showHandoffBanner(primarySid);

    // Skip auto-handoff on duplicate Meterpreter sessions (avoid migrating a
    // backup session out from under the primary). cmd shells are independent —
    // each gets its own (idempotent) handoff.
    for (const s of meterFresh) {
      const sid = String(s.id);
      if (sid !== primarySid) {
        SHELL_STATE.handoffDone[sid] = true;
        appendBuffer(sid,
          '[auto-handoff] duplicate Meterpreter — handoff skipped (primary is [' +
          primarySid + '])\n', 'meta');
      }
    }

    if (!isAutoHandoffEnabled()) return;
    // Schedule the primary, plus any fresh non-meterpreter shells.
    _scheduleHandoff(primarySid);
    for (const s of fresh) {
      const sid = String(s.id);
      if (sid !== primarySid && _sessionStype(s) !== 'meterpreter') {
        _scheduleHandoff(sid);
      }
    }
  }

  function focusShellPanel(sid) {
    const panel = document.getElementById('shell-panel');
    if (panel) panel.scrollIntoView({behavior: 'smooth', block: 'start'});
    if (sid) {
      refreshSessions(true).then(() => selectSession(String(sid)));
    }
  }

  function _sessionRowHtml(s) {
    const stype = (s.type || '?').toUpperCase();
    return `<div class="session-strip-row" data-sid="${s.id}"
                 style="padding:.15rem 0;border-bottom:1px solid var(--border2)">
      <span style="color:var(--green)">[${s.id}]</span>
      <span style="color:var(--violet);margin:0 .4rem">${stype}</span>
      <span style="color:var(--cyan)">${s.target || s.tunnel || '?'}</span>
      <span style="color:var(--muted);margin-left:.4rem">${s.user || ''}</span>
      <span style="color:var(--muted);margin-left:.4rem;font-size:10px">
        ${s.platform || ''} ${s.arch || ''}</span>
    </div>`;
  }

  function syncSessionStrip() {
    const strip = document.getElementById('session-strip');
    const detEl = document.getElementById('ss-detail');
    const txtEl = document.getElementById('ss-text');
    if (!strip || !detEl) return;

    const sessions = SHELL_STATE.sessions || [];
    if (!sessions.length) {
      strip.style.display = 'none';
      detEl.innerHTML = '';
      if (txtEl) txtEl.textContent = '';
      return;
    }

    strip.style.display = 'block';
    detEl.innerHTML = sessions.map(_sessionRowHtml).join('');
    if (txtEl) {
      txtEl.textContent =
        `✓ ${sessions.length} SESSION${sessions.length > 1 ? 'S' : ''} ACTIVE`;
      txtEl.style.color = 'var(--green)';
    }
    const dot = document.getElementById('ss-dot');
    if (dot) {
      dot.style.background = 'var(--green)';
      dot.style.boxShadow = '0 0 0 2px var(--green)33';
    }
  }

  // A probe reported a session dead. We do NOT drop or suppress it locally —
  // msfrpcd's session list is the single source of truth. A transient/over-probe
  // "dead" (or a reused id) must never hide a session that msfrpcd still lists
  // (the v0.9.861 bug where a live root shell didn't render). The session leaves
  // the panel only when msfrpcd actually drops it (refreshSessions reconciles)
  // or the operator kills it. We just print a one-time death note.
  function _noteSessionDead(sid, message) {
    sid = String(sid);
    // Cancel any pending/active handoff so we never prime a corpse (the
    // "[handoff] confirming shell — priming…" against an already-dead session).
    SHELL_STATE.handoffDone[sid] = true;
    if (SHELL_STATE._handoffQueue) {
      SHELL_STATE._handoffQueue = SHELL_STATE._handoffQueue.filter(x => x !== sid);
    }
    if (!SHELL_STATE._deadNoted.has(sid)) {
      SHELL_STATE._deadNoted.add(sid);
      appendBuffer(sid, '[SESSION DIED] ' + (message || '') +
        '\n(will clear from the panel once msfrpcd drops it)\n', 'stderr');
      renderTerm();
    }
  }

  function _dropSessionLocally(sid) {
    sid = String(sid);
    SHELL_STATE.sessions = SHELL_STATE.sessions.filter(s => String(s.id) !== sid);
    SHELL_STATE._prevSessionIds = SHELL_STATE._prevSessionIds.filter(id => id !== sid);
    delete SHELL_STATE.buffers[sid];
    delete SHELL_STATE.history[sid];
    delete SHELL_STATE.histIdx[sid];
    delete SHELL_STATE.histDraft[sid];
    delete SHELL_STATE.handoffDone[sid];
    delete SHELL_STATE.profiles[sid];
    sessionStorage.removeItem('shell_hist_' + sid);

    if (String(SHELL_STATE.handoffBannerSid) === sid) hideHandoffBanner();

    const input = document.getElementById('cmd-input');
    if (SHELL_STATE.active_sid === sid) {
      SHELL_STATE.active_sid = SHELL_STATE.sessions.length
        ? String(SHELL_STATE.sessions[0].id) : null;
      if (input) input.value = '';
      const url = new URL(location);
      if (SHELL_STATE.active_sid) url.searchParams.set('sid', SHELL_STATE.active_sid);
      else url.searchParams.delete('sid');
      history.replaceState(null, '', url.pathname + url.search + url.hash);
    }

    const summary = document.getElementById('session-summary');
    if (summary) {
      summary.textContent = SHELL_STATE.sessions.length
        ? `${SHELL_STATE.sessions.length} active` : '';
    }

    if (!SHELL_STATE.sessions.length) {
      _clearShellArea();
    } else {
      const empty = document.getElementById('no-sessions');
      const active = document.getElementById('active-shell');
      if (empty) empty.style.display = 'none';
      if (active) active.style.display = '';
      renderTabs();
      renderShortcuts();
      renderTerm();
    }
    syncSessionStrip();
  }

  function killAllSessions() {
    const n = SHELL_STATE.sessions.length;
    if (!n) {
      alert('No active sessions to kill.');
      return;
    }
    if (!confirm(`Kill all ${n} MSF session(s)? This cannot be undone.`)) return;

    SHELL_STATE.sessions.forEach(s => SHELL_STATE.closing.add(String(s.id)));
    SHELL_STATE.sessions = [];
    SHELL_STATE.active_sid = null;
    SHELL_STATE._prevSessionIds = [];
    SHELL_STATE.handoffDone = {};
    SHELL_STATE.profiles = {};
    SHELL_STATE.seen.clear();
    SHELL_STATE._deadNoted.clear();
    const url = new URL(location);
    url.searchParams.delete('sid');
    history.replaceState(null, '', url.pathname + url.search + url.hash);
    const summary = document.getElementById('session-summary');
    if (summary) summary.textContent = '';
    _clearShellArea();
    syncSessionStrip();

    fetch('/api/msf/sessions/kill-all', {method: 'POST'})
      .then(r => r.json())
      .then(d => {
        const killed = (d.killed || []).map(String);
        const failed = d.failed || [];
        killed.forEach(sid => {
          SHELL_STATE.closing.delete(sid);
          delete SHELL_STATE.buffers[sid];
          delete SHELL_STATE.history[sid];
          delete SHELL_STATE.histIdx[sid];
          delete SHELL_STATE.histDraft[sid];
          sessionStorage.removeItem('shell_hist_' + sid);
        });
        refreshSessions(true);
        if (failed.length) {
          alert(`Killed ${killed.length}; ${failed.length} failed:\n` +
                failed.map(f => `  [${f.id}] ${f.message}`).join('\n'));
        }
      })
      .catch(() => {
        alert('Failed to reach MSF RPC — is msfrpcd running?');
        SHELL_STATE.closing.clear();
        refreshSessions(true);
      });
  }

  function refreshSessions(force) {
    return fetch('/api/msf/sessions').then(r => r.json()).then(d => {
      const liveIds = new Set((d.sessions || []).map(s => String(s.id)));

      // Reconcile against msfrpcd (the source of truth). Once an id leaves the
      // list it's truly gone — clear our per-id markers so a future (reused) id
      // renders cleanly.
      for (const sid of [...SHELL_STATE.closing]) {
        if (!liveIds.has(sid)) SHELL_STATE.closing.delete(sid);
      }
      for (const sid of [...SHELL_STATE._deadNoted]) {
        if (!liveIds.has(sid)) SHELL_STATE._deadNoted.delete(sid);
      }

      // Render = exactly MSF's list minus operator-kills in flight. We do NOT
      // hide sessions on a probe-reported death — only msfrpcd dropping them (or
      // an operator kill) removes a tab. This guarantees a live session always
      // shows (fixes the live root shell that was hidden by a stale dead flag).
      let sessions = (d.sessions || []).filter(
        s => !SHELL_STATE.closing.has(String(s.id))
      );

      // "fresh" = never seen before (persistent), so a session that briefly
      // drops and is re-listed does NOT re-fire the handoff — the loop that
      // attached/dropped sessions 1-4 over and over.
      const fresh = sessions.filter(s => !SHELL_STATE.seen.has(String(s.id)));
      sessions.forEach(s => SHELL_STATE.seen.add(String(s.id)));

      SHELL_STATE.sessions = sessions;
      const summary = document.getElementById('session-summary');
      if (summary) {
        summary.textContent = sessions.length ? `${sessions.length} active` : '';
      }

      if (!sessions.length) {
        SHELL_STATE.active_sid = null;
        SHELL_STATE._prevSessionIds = [];
        _clearShellArea();
        syncSessionStrip();
        return;
      }

      const empty = document.getElementById('no-sessions');
      const active = document.getElementById('active-shell');
      if (empty) empty.style.display = 'none';
      if (active) active.style.display = '';

      const urlSid = new URLSearchParams(location.search).get('sid');
      if (urlSid && sessions.some(s => String(s.id) === String(urlSid))) {
        SHELL_STATE.active_sid = String(urlSid);
      } else if (!SHELL_STATE.active_sid ||
                  !sessions.some(s => String(s.id) === String(SHELL_STATE.active_sid))) {
        SHELL_STATE.active_sid = String(sessions[0].id);
      }

      SHELL_STATE._prevSessionIds = sessions.map(s => String(s.id));
      if (fresh.length) _onNewSessions(fresh);

      renderTabs();
      renderShortcuts();
      renderTerm();
      syncSessionStrip();
    });
  }

  function renderTabs() {
    const tabs = document.getElementById('session-tabs');
    if (!tabs) return;
    if (!SHELL_STATE.sessions.length) {
      tabs.innerHTML = '';
      return;
    }
    tabs.innerHTML = SHELL_STATE.sessions.map(s => {
      const sid    = String(s.id);
      const stype  = (s.type || '').toLowerCase().includes('meter') ? 'meterpreter'
                    : (s.type || '').toLowerCase();
      const active = sid === SHELL_STATE.active_sid ? ' active' : '';
      const label  = s.user || s.info || 'session';
      return `<div class="session-tab type-${stype}${active}"
                   onclick="selectSession('${sid}')">
        <span class="tab-dot">●</span>
        <span style="color:var(--text)">[${sid}]</span>
        <span style="color:var(--muted);font-size:10px">${stype}</span>
        <span style="color:var(--cyan)">${s.target || '?'}</span>
        <span style="color:var(--muted);font-size:10px">${label}</span>
        <span class="tab-close" title="Close session ${sid}"
              onclick="event.stopPropagation();closeSession('${sid}')">✕</span>
      </div>`;
    }).join('');
  }

  function closeSession(sid) {
    sid = String(sid);
    if (!confirm(`Close session ${sid}? This stops it in Metasploit.`)) return;

    SHELL_STATE.closing.add(sid);
    _dropSessionLocally(sid);

    fetch(`/api/msf/session/${sid}/kill`, {method: 'POST'})
      .then(r => r.json())
      .then(d => {
        SHELL_STATE.closing.delete(sid);
        refreshSessions(true);
        if (d.status !== 'ok') {
          alert('Could not close session ' + sid + ': ' +
                (d.message || 'unknown error'));
        }
      })
      .catch(() => {
        SHELL_STATE.closing.delete(sid);
        alert('Failed to reach MSF RPC — is msfrpcd running?');
        refreshSessions(true);
      });
  }

  function renderShortcuts() {
    const bank = document.getElementById('shortcut-bank');
    if (!bank) return;
    const s = SHELL_STATE.sessions.find(s => String(s.id) === SHELL_STATE.active_sid);
    if (!s) { bank.innerHTML = ''; return; }
    const stype = (s.type || '').toLowerCase().includes('meter') ? 'meterpreter'
                 : ((s.type || '').toLowerCase() || 'shell');
    const list  = SHORTCUTS[stype] || SHORTCUTS.shell;

    bank.innerHTML = list.map(sc =>
      `<button class="shortcut-btn ${sc.cls || ''}"
               onclick="runShortcut(${JSON.stringify(sc.cmd).replace(/"/g,'&quot;')})">
        ${sc.label}
      </button>`
    ).join('') +
    `<button class="shortcut-btn creds" onclick="captureCreds()"
             title="Run the appropriate hashdump command and push parsed creds to the store">
      🔑 CAPTURE CREDS
    </button>`;
  }

  function renderTerm() {
    const term = document.getElementById('shell-term');
    if (!term) return;
    const buf  = SHELL_STATE.buffers[SHELL_STATE.active_sid] || '';
    if (!buf) {
      term.innerHTML = '<span class="meta">[session ' + SHELL_STATE.active_sid +
                       ' attached — output will stream here]</span>\n';
    } else {
      term.textContent = buf;
    }
    term.scrollTop = term.scrollHeight;
  }

  function selectSession(sid) {
    SHELL_STATE.active_sid = String(sid);
    const url = new URL(location);
    url.searchParams.set('sid', sid);
    history.replaceState(null, '', url.pathname + url.search + url.hash);
    renderTabs(); renderShortcuts(); renderTerm();
    const stored = sessionStorage.getItem('shell_hist_' + sid);
    SHELL_STATE.history[sid] = stored ? JSON.parse(stored) : [];
    SHELL_STATE.histIdx[sid] = SHELL_STATE.history[sid].length;
  }

  function pollLoop() {
    if (SHELL_STATE.polling) return;
    SHELL_STATE.polling = true;
    setInterval(() => {
      const sid = SHELL_STATE.active_sid;
      if (!sid) return;
      fetch(`/api/msf/session/${sid}/read`).then(r => r.json()).then(d => {
        if (d.status === 'ok' && d.output) {
          appendBuffer(sid, d.output, 'stdout');
          renderTerm();
        } else if (d.session_dead) {
          _noteSessionDead(sid, d.message);   // note only; refresh reconciles
        }
      }).catch(() => {});
    }, 1500);
  }

  function appendBuffer(sid, text, kind) {
    if (!SHELL_STATE.buffers[sid]) SHELL_STATE.buffers[sid] = '';
    SHELL_STATE.buffers[sid] += text;
    if (SHELL_STATE.buffers[sid].length > 204800) {
      SHELL_STATE.buffers[sid] = '...[truncated]...\n' +
        SHELL_STATE.buffers[sid].slice(-180000);
    }
  }

  function sendCmd() {
    const input = document.getElementById('cmd-input');
    if (!input) return;
    const cmd   = input.value;
    if (!cmd.trim() || !SHELL_STATE.active_sid) return;

    const sid = SHELL_STATE.active_sid;
    if (!SHELL_STATE.history[sid]) SHELL_STATE.history[sid] = [];
    const hist = SHELL_STATE.history[sid];
    if (hist[hist.length - 1] !== cmd) {
      hist.push(cmd);
      if (hist.length > 100) hist.shift();
      sessionStorage.setItem('shell_hist_' + sid, JSON.stringify(hist));
    }
    SHELL_STATE.histIdx[sid] = hist.length;

    appendBuffer(sid, '\n$ ' + cmd + '\n', 'echo');
    renderTerm();
    input.value = '';

    fetch(`/api/msf/session/${sid}/run`, {
      method:  'POST',
      headers: {'Content-Type': 'application/json'},
      body:    JSON.stringify({command: cmd, timeout: 15}),
    }).then(r => r.json()).then(d => {
      if (d.status === 'ok') {
        appendBuffer(sid, d.output || '', 'stdout');
      } else if (d.session_dead) {
        _noteSessionDead(sid, d.message);   // consistent, gated death note
        refreshSessions(true);              // snappy reconcile against msfrpcd
        return;
      } else {
        appendBuffer(sid, '[ERROR] ' + (d.message || 'unknown') + '\n', 'stderr');
      }
      renderTerm();
    });
  }

  function runShortcut(cmd) {
    const input = document.getElementById('cmd-input');
    if (!input) return;
    input.value = cmd;
    sendCmd();
  }

  function onCmdKeydown(e) {
    const sid   = SHELL_STATE.active_sid;
    const input = e.target;
    if (e.key === 'Enter') { sendCmd(); return; }
    if (!sid) return;
    const hist = SHELL_STATE.history[sid] || [];
    if (e.key === 'ArrowUp') {
      if (!hist.length) return;
      e.preventDefault();
      if (SHELL_STATE.histIdx[sid] === hist.length) {
        SHELL_STATE.histDraft[sid] = input.value;
      }
      SHELL_STATE.histIdx[sid] = Math.max(0, SHELL_STATE.histIdx[sid] - 1);
      input.value = hist[SHELL_STATE.histIdx[sid]];
      input.setSelectionRange(input.value.length, input.value.length);
    } else if (e.key === 'ArrowDown') {
      if (!hist.length) return;
      e.preventDefault();
      SHELL_STATE.histIdx[sid] = Math.min(hist.length, SHELL_STATE.histIdx[sid] + 1);
      if (SHELL_STATE.histIdx[sid] === hist.length) {
        input.value = SHELL_STATE.histDraft[sid] || '';
      } else {
        input.value = hist[SHELL_STATE.histIdx[sid]];
      }
      input.setSelectionRange(input.value.length, input.value.length);
    }
  }

  function captureCreds() {
    const sid = SHELL_STATE.active_sid;
    if (!sid) return;
    appendBuffer(sid, '\n[capturing creds — running hashdump/shadow as appropriate...]\n', 'meta');
    renderTerm();
    fetch(`/api/msf/session/${sid}/capture_creds`, {method: 'POST'})
      .then(r => r.json().then(d => ({ok: r.ok, d})))
      .then(({ok, d}) => {
        let msg;
        if (!ok || d.status === 'error') {
          msg = '[capture failed] ' + (d.message || 'unknown error') + '\n';
        } else if (d.captured) {
          msg = `[✓ captured ${d.captured} credential(s) — pushed to credential store]\n` +
            (d.sample || []).map(c => `    ${c.username} (${c.type})`).join('\n') + '\n';
          if ((d.errors || []).length) msg += '    (some entries skipped: ' + d.errors.join('; ') + ')\n';
        } else {
          msg = '[no credentials parsed from output — try running the dump manually]\n' +
            ((d.errors || []).length ? '    (' + d.errors.join('; ') + ')\n' : '');
        }
        appendBuffer(sid, msg, d.captured ? 'echo' : 'meta');
        renderTerm();
      })
      .catch(e => {
        appendBuffer(sid, '[capture failed] ' + e.message + '\n', 'stderr');
        renderTerm();
      });
  }

  document.addEventListener('DOMContentLoaded', () => {
    _syncAutohandoffCheckboxes();
    refreshSessions().then(() => {
      pollLoop();
      const urlSid = new URLSearchParams(location.search).get('sid');
      if (urlSid) focusShellPanel(urlSid);
      else if (location.hash === '#shell-panel') focusShellPanel();
    });
    setInterval(refreshSessions, 4000);
    if (!window.SHELL_EMBEDDED) {
      document.getElementById('cmd-input')?.focus();
    }
  });
</script>
