<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>H3x-Dash // Purple Ops Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --void:#0c0c11; --surface:#121219; --surface2:#0f0f15;
  --line:#1c1c28; --line-faint:#16161f;
  --cyan:#0ff0fc; --violet:#9b30ff; --acid:#39ff14;
  --danger:#ff4d4d; --warn:#ff9e2c;
  --text:#b6c2cf; --dim:#6c7686; --muted:#464d5b;
  --topbar-h:54px; --side-w:clamp(186px,17vw,230px); --dock-h:82px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--void); color:var(--text);
  font-family:"Share Tech Mono","Courier New",monospace;
  overflow:hidden; line-height:1.6; font-size:13px;
}
/* calm atmosphere: one faint grid + a soft top glow. no scanlines. */
body::before{
  content:""; position:fixed; inset:0; pointer-events:none; z-index:0; opacity:.55;
  background:
    radial-gradient(900px 380px at 60% -8%, rgba(15,240,252,.05), transparent 70%),
    linear-gradient(rgba(155,48,255,.022) 1px,transparent 1px),
    linear-gradient(90deg,rgba(15,240,252,.018) 1px,transparent 1px);
  background-size:auto, 44px 44px, 44px 44px;
}
h1,h2,h3,.rj{font-family:"Rajdhani",sans-serif}
::selection{background:rgba(15,240,252,.25)}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#1e1e2c;border-radius:5px}
::-webkit-scrollbar-track{background:transparent}

/* ── PRIMARY AXIS — overhead workflow tabs ──────────────────────────────── */
.topbar{position:fixed;top:0;left:0;right:0;height:var(--topbar-h);z-index:40;display:flex;
  align-items:stretch;background:rgba(11,11,16,.92);backdrop-filter:blur(6px);
  border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;padding:0 20px;border-right:1px solid var(--line);white-space:nowrap}
.brand .mark{font-family:"Rajdhani",sans-serif;font-weight:700;font-size:18px;letter-spacing:.16em;color:#fff}
.brand .mark b{color:var(--acid)}
.brand .sub{font-size:8px;letter-spacing:.3em;color:var(--dim);margin-top:3px}
.tabs{display:flex;align-items:stretch;overflow-x:auto;flex:1;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{display:flex;align-items:center;gap:8px;padding:0 17px;cursor:pointer;
  font-family:"Rajdhani",sans-serif;font-weight:600;font-size:12.5px;letter-spacing:.14em;
  color:var(--dim);white-space:nowrap;position:relative;transition:color .16s}
.tab .tnum{font-size:9px;color:var(--muted);font-family:"Share Tech Mono",monospace}
.tab:hover{color:var(--text)}
.tab.active{color:#fff}
.tab.active::after{content:"";position:absolute;left:14px;right:14px;bottom:-1px;height:2px;
  background:var(--cyan);box-shadow:0 0 12px rgba(15,240,252,.7)}
.tab .dotnew{width:5px;height:5px;border-radius:50%;background:var(--violet)}
.statusdock{position:fixed;left:0;bottom:0;width:var(--side-w);z-index:41;
  background:linear-gradient(0deg,rgba(6,6,10,.97),rgba(9,9,13,.82));
  border-top:1px solid var(--line);border-right:1px solid var(--line);
  padding:10px 16px;display:flex;flex-direction:column;gap:7px;backdrop-filter:blur(6px)}
.statusdock .si{width:100%;min-width:0}
.statusdock .siv{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.si{display:flex;align-items:center;gap:7px;font-size:10px;letter-spacing:.1em}
.si .lbl{color:var(--muted)}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block}
.dot.on{background:var(--acid);box-shadow:0 0 7px rgba(57,255,20,.8)}
.dot.watch{background:var(--cyan);box-shadow:0 0 7px rgba(15,240,252,.8)}

/* ── SECONDARY AXIS — contextual side-nav + main ────────────────────────── */
.shell{position:fixed;top:var(--topbar-h);left:0;right:0;bottom:0;display:flex;z-index:1}
.sidenav{width:var(--side-w);flex:0 0 var(--side-w);overflow-y:auto;
  background:rgba(9,9,13,.6);border-right:1px solid var(--line);padding:18px 0 calc(var(--dock-h) + 6px)}
.side-eyebrow{font-family:"Rajdhani",sans-serif;font-size:9.5px;letter-spacing:.28em;
  color:var(--violet);padding:0 20px 12px}
.mlink{display:flex;align-items:center;gap:12px;padding:8px 20px;cursor:pointer;font-size:12.5px;
  color:var(--dim);border-left:2px solid transparent;transition:color .12s,background .12s,border-color .12s}
.mlink .mi{width:15px;text-align:center;font-size:13px;color:var(--muted);transition:color .12s}
.mlink:hover{color:var(--text);background:rgba(15,240,252,.03)}
.mlink:hover .mi{color:var(--cyan)}
.mlink.active{color:#fff;background:rgba(15,240,252,.055);border-left-color:var(--cyan)}
.mlink.active .mi{color:var(--cyan)}
.tag-new{margin-left:auto;font-size:7.5px;letter-spacing:.14em;color:var(--violet);
  border:1px solid #2f1c44;border-radius:3px;padding:1px 5px}

.main{flex:1;overflow-y:auto;min-width:0;padding:clamp(16px,2.4vw,28px) clamp(16px,3vw,36px) 80px}
.wrap{max-width:1020px}
.crumb{font-size:10px;letter-spacing:.18em;color:var(--muted);margin-bottom:7px}
.crumb b{color:var(--violet);font-weight:400}
.phead{display:flex;align-items:baseline;gap:13px;flex-wrap:wrap}
.phead h1{font-size:25px;letter-spacing:.03em;color:#fff;font-weight:600}
.pdesc{font-size:12.5px;color:var(--dim);max-width:720px;margin:9px 0 0;line-height:1.7}
.divider{height:1px;background:var(--line);margin:22px 0 26px}

/* section — no boxed card by default; eyebrow + air */
.sec{margin-bottom:30px}
.eyebrow{display:flex;align-items:center;gap:9px;font-family:"Rajdhani",sans-serif;font-weight:600;
  font-size:10.5px;letter-spacing:.24em;color:var(--violet);margin-bottom:14px}
.eyebrow i{width:14px;height:2px;background:var(--violet);display:inline-block;opacity:.7}
.sec-note{font-size:11px;color:var(--muted);margin-top:11px;letter-spacing:.03em;line-height:1.6}

/* surface — used sparingly, for things that need a real container */
.surface{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px 18px}

/* stats — minimal, divided by space not borders */
.stats{display:flex;gap:30px;flex-wrap:wrap;margin-bottom:4px}
.stat .sv{font-family:"Rajdhani",sans-serif;font-weight:700;font-size:30px;line-height:1}
.stat .sk{font-size:8.5px;letter-spacing:.2em;color:var(--muted);margin-top:6px}

/* fields + controls */
.controls{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-end}
.fld{display:flex;flex-direction:column;gap:6px}
.fld label{font-size:8.5px;letter-spacing:.18em;color:var(--muted)}
.inp,.sel{background:var(--surface2);border:1px solid #23232f;color:var(--cyan);font-family:inherit;
  font-size:12px;padding:8px 12px;border-radius:5px;min-width:160px;transition:border-color .14s}
.inp::placeholder{color:#3a4150}
.inp:focus,.sel:focus{outline:none;border-color:var(--cyan)}
.btn{font-family:"Rajdhani",sans-serif;font-weight:700;letter-spacing:.11em;font-size:12px;
  padding:9px 17px;border-radius:6px;cursor:pointer;border:1px solid;background:transparent;transition:background .15s,color .15s}
.btn.pri{color:var(--cyan);border-color:#1c4a52}
.btn.pri:hover{background:rgba(15,240,252,.09)}
.btn.go{color:var(--acid);border-color:#1e5230}
.btn.go:hover{background:rgba(57,255,20,.09)}
.btn.stop{color:var(--danger);border-color:#5e2020}
.btn.stop:hover{background:rgba(255,77,77,.09)}
.btn.ghost{color:var(--dim);border-color:#23232f}
.btn.ghost:hover{color:var(--text);background:rgba(255,255,255,.02)}
.btn.sm{padding:5px 11px;font-size:10.5px}

.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{font-size:10px;letter-spacing:.04em;padding:4px 10px;border-radius:14px;border:1px solid #23232f;color:var(--dim)}
.chip.on{color:var(--acid);border-color:#1e5230}
.chip.att{color:var(--violet);border-color:#2a1a3a}
.chip.src{color:var(--cyan);border-color:#153740}

.statusline{display:flex;align-items:center;gap:10px;font-size:11px;color:var(--dim);margin:16px 0 0;letter-spacing:.05em}
.sdot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.sdot.run{background:var(--acid);box-shadow:0 0 7px rgba(57,255,20,.7)}

/* tables — airy, hairline separators, no vertical rules */
.tblwrap{border:1px solid var(--line);border-radius:8px;overflow:hidden}
table{width:100%;border-collapse:collapse;font-size:12px}
thead th{text-align:left;padding:10px 15px;font-size:8.5px;letter-spacing:.16em;color:var(--muted);
  background:rgba(255,255,255,.012);border-bottom:1px solid var(--line);font-weight:400}
tbody td{padding:11px 15px;border-bottom:1px solid var(--line-faint);color:var(--text)}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover td{background:rgba(15,240,252,.02)}
.num{font-variant-numeric:tabular-nums}
.pill{font-size:8.5px;letter-spacing:.08em;padding:2px 8px;border-radius:4px;border:1px solid;white-space:nowrap}
.pill.ok{color:var(--acid);border-color:#1e5230} .pill.no{color:var(--danger);border-color:#5e2020}
.pill.warn{color:var(--warn);border-color:#5e3e1e} .pill.info{color:var(--cyan);border-color:#1c4a52}
.pill.muted{color:var(--dim);border-color:#2a2a38}
.pill.crit{color:#fff;background:#3a0d0d;border-color:#7a1f1f}

/* terminal — one accent edge, calm syntax */
.term{background:var(--surface2);border:1px solid var(--line);border-left:2px solid var(--acid);
  border-radius:7px;padding:13px 15px;font-size:11.5px;line-height:1.75;max-height:250px;overflow:auto;white-space:pre-wrap}
.term .c{color:var(--cyan)} .term .v{color:var(--violet)} .term .g{color:var(--acid)}
.term .r{color:var(--danger)} .term .w{color:var(--warn)} .term .d{color:var(--muted)}

/* detection strip — the signature, calmed down */
.detstrip{border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-bottom:26px;background:var(--surface2)}
.detstrip .dh{display:flex;align-items:center;gap:8px;padding:9px 16px;border-bottom:1px solid var(--line);
  font-size:9px;letter-spacing:.22em;color:var(--violet)}
.detstrip .dh .eye{color:var(--cyan);font-size:11px}
.dflow{display:flex;flex-wrap:wrap}
.dcol{flex:1;min-width:200px;padding:15px 16px;border-right:1px solid var(--line)}
.dcol:last-child{border-right:none}
.dcol .dk{font-size:8px;letter-spacing:.2em;color:var(--muted);margin-bottom:9px}
.detrow{display:flex;align-items:center;gap:9px;font-size:10.5px;margin:6px 0;color:var(--text)}
.led{width:7px;height:7px;border-radius:50%;flex:0 0 7px}
.led.hit{background:var(--acid);box-shadow:0 0 6px rgba(57,255,20,.8)}
.led.part{background:var(--warn);box-shadow:0 0 6px rgba(255,158,44,.8)}
.led.miss{background:var(--danger);box-shadow:0 0 6px rgba(255,77,77,.8)}
.led.pend{background:var(--muted)}

/* session tabs */
.stabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.stab{font-size:11px;padding:7px 13px;border-radius:6px 6px 0 0;border:1px solid var(--line);
  border-bottom:none;color:var(--dim);cursor:pointer;background:var(--surface2)}
.stab.active{color:#fff;border-color:#1c4a52;background:var(--surface)}
.stab .sid{color:var(--acid)}

/* topology mini-graph */
.topo{border:1px solid var(--line);border-radius:8px;background:var(--surface2);padding:8px}

/* coverage bar */
.covbar{height:24px;border-radius:6px;overflow:hidden;display:flex;border:1px solid var(--line);
  font-size:9.5px;margin:14px 0 4px}
.covbar span{display:flex;align-items:center;justify-content:center;color:#0c0c11;font-weight:700}

.proto-flag{position:fixed;bottom:13px;right:15px;z-index:70;font-size:8.5px;letter-spacing:.16em;
  color:var(--warn);border:1px solid #3a2600;background:rgba(20,12,0,.85);border-radius:6px;padding:6px 11px}

@media (max-width:840px){:root{--side-w:168px;--dock-h:78px} .brand .sub{display:none} .main{padding:18px 16px 84px}}
@media (max-width:560px){:root{--side-w:138px} .brand{padding:0 12px} .brand .mark{font-size:15px} .tab{padding:0 12px} .statusdock{padding:8px 10px;gap:5px} .statusdock .si{font-size:9px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>

<header class="topbar">
  <div class="brand"><div>
    <div class="mark">// H3X<b>·</b>DASH //</div>
    <div class="sub">PURPLE OPS CONSOLE</div>
  </div></div>
  <nav class="tabs" id="tabs"></nav>
</header>

<aside class="statusdock" aria-label="system status">
  <div class="si"><span class="lbl">MSF&nbsp;RPC</span><span class="dot" id="msfDot"></span><span id="msfText" class="siv" style="color:var(--dim)">checking…</span></div>
  <div class="si"><span class="lbl">SIEM</span><span class="dot watch"></span><span class="siv" style="color:var(--cyan)">MONITORING</span></div>
  <div class="si"><span class="lbl">TGT</span><span id="tgtText" class="siv" style="color:var(--dim)">10.10.10.0/24</span></div>
</aside>

<div class="shell">
  <aside class="sidenav" id="sidenav"></aside>
  <main class="main" id="main"><div class="wrap" id="wrap"></div></main>
</div>

<div id="toaster" style="position:fixed;bottom:46px;right:15px;z-index:80;display:flex;flex-direction:column;gap:8px;align-items:flex-end;max-width:360px"></div>
<div class="proto-flag">◆ LIVE CONSOLE — wired to the H3x-Dash API at <b style="color:var(--cyan)">/console</b></div>

<script>
'use strict';
// ═══════════════════════════════════════════════════════════════════════════
//  H3x-Dash · Purple Ops Console — live client
//  Preserves the prototype's design system; every pane is wired to the real
//  Flask API (same-origin /api/*). Panes without a backend endpoint in this
//  build render an honest "not wired" roadmap card instead of faking controls.
// ═══════════════════════════════════════════════════════════════════════════

const S = { ws:'overview', mod:'dashboard', target:'10.10.10.0/24',
            msf:{connected:false, version:''}, _streams:[], _timers:[] };

// ── Workspaces (primary tabs → contextual modules) ──────────────────────────
const WS = [
  {id:'overview',label:'OVERVIEW',modules:[{id:'dashboard',label:'Dashboard',icon:'◈'}]},
  {id:'recon',label:'RECON & ENUM',modules:[
    {id:'scan',label:'Scan',icon:'◉'},{id:'topology',label:'Topology',icon:'◭'},
    {id:'webscan',label:'Web Scan',icon:'◍'},{id:'enum',label:'Enum Suite',icon:'⚙'},
    {id:'msfscan',label:'MSF Scanners',icon:'▦'}]},
  {id:'access',label:'ACCESS',modules:[
    {id:'exploit',label:'Exploit',icon:'⚡'},{id:'validate',label:'Validate',icon:'◇'},
    {id:'shell',label:'Sessions / Shell',icon:'▸'},{id:'payloads',label:'Payloads',icon:'❏'},
    {id:'spectrum',label:'Spectrum',icon:'∿'}]},
  {id:'credsad',label:'CREDS & AD',modules:[
    {id:'loot',label:'Loot Creds',icon:'🔑'},{id:'responder',label:'Responder + Relay',icon:'☰',isnew:true},
    {id:'roast',label:'Kerberoast / AS-REP',icon:'⛨',isnew:true},{id:'bloodhound',label:'BloodHound',icon:'⌖',isnew:true},
    {id:'impacket',label:'Impacket-AD',icon:'⊟',isnew:true},{id:'certipy',label:'Certipy / ADCS',icon:'⬡',isnew:true},
    {id:'coercion',label:'Coercion',icon:'⇄',isnew:true}]},
  {id:'lce',label:'LATERAL / C2',modules:[
    {id:'lateral',label:'Lateral Movement',icon:'⇉',isnew:true},{id:'c2',label:'C2 Beacon Emulator',icon:'◕',isnew:true}]},
  {id:'emulation',label:'EMULATION',modules:[
    {id:'atomic',label:'Atomic Red Team',icon:'⚛',isnew:true},{id:'caldera',label:'CALDERA',icon:'⬢',isnew:true},
    {id:'playbooks',label:'Scenario Playbooks',icon:'❑',isnew:true}]},
  {id:'report',label:'REPORT & PURPLE',modules:[
    {id:'engagement',label:'Engagement Report',icon:'◎'},{id:'coverage',label:'Detection Coverage',icon:'▤',isnew:true}]},
];

// ── Module metadata (desc + purple detection wiring) ────────────────────────
const META = {
  topology:{d:'Live graph of discovered hosts, risk-tiered ports, and their relationships.'},
  webscan:{d:'Layer-7 web scan — response headers, tech fingerprint, and http-NSE surface.'},
  msfscan:{d:'Metasploit auxiliary scanner modules for post-recon confirmation.'},
  spectrum:{d:'RF / wireless operations — device control, recon sweeps, and handshake capture.'},
  responder:{d:'LLMNR / NBT-NS / mDNS poisoning with SMB/LDAP/ADCS relay via Responder + ntlmrelayx.',
    tech:['T1557.001','T1187'],src:['Zeek dns / mdns','Suricata ET','Sysmon 4624'],
    det:[['ET LLMNR/NBT-NS poisoning','hit'],['Sigma: Responder capture','hit'],['Unexpected machine-account logon','part']],
    tools:['Responder','ntlmrelayx (impacket)']},
  roast:{d:'GetUserSPNs / GetNPUsers roast-and-crack — request RC4 tickets, hand off to hashcat.',
    tech:['T1558.003','T1558.004'],src:['4769 (0x17/RC4)','Zeek kerberos'],det:[['Sigma: Kerberoasting 4769','hit'],['ET Kerberos RC4','hit']],
    tools:['impacket GetUserSPNs / GetNPUsers','hashcat']},
  bloodhound:{d:'SharpHound / bloodhound-python collection — LDAP + session enumeration for attack paths.',
    tech:['T1087.002','T1482'],src:['4662 volume','Zeek ldap'],det:[['Sigma: SharpHound burst','part'],['ET LDAP enumeration','miss']],
    tools:['bloodhound-python','SharpHound','neo4j']},
  impacket:{d:'Impacket AD — secretsdump / DCSync credential extraction against the DC.',
    tech:['T1003.006'],src:['4662 + DRSUAPI GUID','Zeek drsuapi'],det:[['Sigma: DCSync (DRSUAPI)','hit'],['ET replication','part']],
    tools:['impacket secretsdump']},
  certipy:{d:'Certipy ADCS abuse — enumerate + exploit ESC1–ESC8 certificate misconfigurations.',
    tech:['T1649'],src:['4886 / 4887 enroll','Zeek'],det:[['Sigma: suspicious enrollment','miss'],['ESC1 template abuse','miss']],
    tools:['Certipy']},
  coercion:{d:'Auth coercion — PetitPotam (EFSRPC) and PrinterBug (MS-RPRN) force machine auth.',
    tech:['T1187'],src:['Zeek efsrpc / rprn','5145'],det:[['Sigma: PetitPotam EFSRPC','hit'],['ET PrinterBug','part']],
    tools:['PetitPotam','printerbug (dementor)']},
  lateral:{d:'Lateral movement — psexec / smbexec / wmiexec / dcomexec / atexec / evil-winrm, plus PtH / PtT.',
    tech:['T1021.002','T1047','T1053.005','T1550.002'],src:['7045 service','Zeek smb / pipes','WMI process-create','4698'],
    det:[['Sigma: PsExec service (7045)','hit'],['Sigma: WMI remote exec','part'],['ET SMBExec pipe','hit']],
    tools:['impacket *exec','evil-winrm','netexec']},
  c2:{d:'Synthetic C2 beaconing — jittered HTTP/HTTPS/DNS callbacks with tunable sleep + malleable profiles.',
    tech:['T1071.001','T1571','T1573'],src:['Zeek conn / JA3','RITA score'],det:[['RITA: interval beacon','hit'],['Suricata: JA3','part'],['Zeek: long-conn','pend']],
    tools:['synthetic beacon emitter']},
  atomic:{d:'Atomic Red Team — invoke-atomicredteam runs portable, ATT&CK-mapped atomics built for detection validation.',
    tech:['T1218.011','T1059.001','T1547.001'],src:['Sysmon 1 / 11 / 13','4688'],
    det:[['Sigma: rundll32 LOLBAS','hit'],['Sigma: PS script block','hit'],['Sigma: Run-key persist','hit']],
    tools:['Invoke-AtomicRedTeam']},
  caldera:{d:'MITRE CALDERA — autonomous, chained adversary emulation across the ATT&CK matrix.',
    tech:['T1059','T1053','T1105'],src:['Sysmon','4688','Zeek http'],det:[['CALDERA agent beacon','part'],['Sigma: ability exec','hit']],
    tools:['MITRE CALDERA server + agents']},
  playbooks:{d:'Named-actor + ransomware-precursor scenario chains — sequenced end-to-end intrusion emulation.',
    tech:['T1486','T1490','T1070.001'],src:['Sysmon','1102 log clear','VSS delete'],
    det:[['Sigma: shadow-copy delete','hit'],['Sigma: log cleared (1102)','hit'],['Mass file rename','part']],
    tools:['chained scenario runner']},
  engagement:{d:'Client-deliverable engagement report — scan, creds, exploit outcomes, verdicts and ATT&CK coverage in one SPECTR report.'},
};

// ── DOM refs ────────────────────────────────────────────────────────────────
const wrap = document.getElementById('wrap');
const main = document.getElementById('main');

// ── tiny utils ──────────────────────────────────────────────────────────────
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const mask = s => { s=String(s==null?'':s); if(!s) return '—'; return s[0]+'•••••• ('+s.length+')'; };
const when = ts => ts ? String(ts) : '—';
const num = v => (v==null||v==='')?'—':v;
function toast(msg, kind='ok', ttl=4200){
  const box=document.getElementById('toaster');
  const col = kind==='err'?'var(--danger)':kind==='warn'?'var(--warn)':'var(--acid)';
  const d=document.createElement('div');
  d.style.cssText=`border:1px solid ${col};border-left:3px solid ${col};background:rgba(11,11,16,.94);`
    +`color:var(--text);font-size:11.5px;letter-spacing:.03em;padding:10px 13px;border-radius:6px;`
    +`box-shadow:0 6px 22px rgba(0,0,0,.5);max-width:360px;line-height:1.5`;
  d.innerHTML=`<span style="color:${col};font-weight:700">${kind==='err'?'✕':kind==='warn'?'△':'✓'}</span>&nbsp;&nbsp;${esc(msg)}`;
  box.appendChild(d);
  if(ttl>0) setTimeout(()=>{d.style.transition='opacity .3s';d.style.opacity='0';setTimeout(()=>d.remove(),320);},ttl);

// ── API layer ───────────────────────────────────────────────────────────────
const api = {
  async get(url){ try{ const r=await fetch(url); return await r.json(); }
    catch(e){ toast('GET '+url+' failed: '+e.message,'err'); return null; } },
  async post(url, body){ try{
      const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body||{})});
      return await r.json(); }
    catch(e){ toast('POST '+url+' failed: '+e.message,'err'); return {status:'error',message:e.message}; } },
  // start+stream pattern: POST start → {client_id}; open SSE stream?client_id=…
  async stream(startUrl, body, streamBase, {term, onEvent, onDone}={}){
    const res = await api.post(startUrl, body);
    if(!res || res.status==='error' || res.error){
      const m = (res&&(res.message||res.error))||'failed to start';
      if(term) termLine(term, '[!] '+m, 'err'); toast(m,'err'); if(onDone)onDone({type:'error',data:m}); return null;
    }
    const cid = res.client_id || 'default';
    const es = new EventSource(streamBase+'?client_id='+encodeURIComponent(cid));
    S._streams.push(es);
    es.onmessage = e => { let m; try{ m=JSON.parse(e.data); }catch{ return; }
      if(m.type==='heartbeat') return;
      if(m.type==='output' && term) termLine(term, m.data);
      if(onEvent) onEvent(m);
      if(m.type==='complete' || m.type==='error'){ es.close();
        if(m.type==='error' && term) termLine(term, '[!] '+(m.data||'error'), 'err');
        if(onDone) onDone(m); }
    };
    es.onerror = () => { es.close(); };
    return {es, started:res};
  }
};

// ── terminal helper (colourises like the app's shared JS) ────────────────────
function termLine(el, text, cls){
  if(!el) return;
  if(!cls){ const lo=String(text).toLowerCase();
    if(lo.includes('[error]')||lo.includes('[!]')||lo.includes('[-]')) cls='r';
    else if(lo.includes('[warn')||lo.includes('△')||lo.includes('⚠')) cls='w';
    else if(lo.includes('[h3x-dash]')||lo.includes('[*]')) cls='c';
    else if(lo.includes('[+]')||lo.includes('vulnerable')||lo.includes('session opened')) cls='g';
    else if(lo.startsWith('  ')||lo.startsWith('↳')||lo.startsWith('──')) cls='d'; }
  const span=document.createElement('span');
  if(cls) span.className=cls;
  span.textContent=text+'\n';
  el.appendChild(span); el.scrollTop=el.scrollHeight;
}
function clearTerm(el){ if(el) el.textContent=''; }

function msfVersionStr(v){
  if(!v) return '';

  if(typeof v === 'object') return v.version || v.ver || v.api || v.framework || '';

}
async function refreshMsf(){
  const st = await api.get('/api/msf/status');

      }));

PANES.shell = {
  body(){ return sec('ACTIVE SESSIONS',
    `<div class="stabs" data-box="stabs"><span class="sec-note">loading sessions…</span></div>

      if(!ss.length){ b.innerHTML='<span class="sec-note">No active sessions. Land one from the Exploit tab.</span>'; S._sid=null; return; }

//  ADVERSARY EMULATION (purple team) — Atomic Red Team / CALDERA / Playbooks
//  Wrap REAL tooling; when a backing tool is absent the pane says so honestly
//  and disables firing rather than faking telemetry.
// ═══════════════════════════════════════════════════════════════════════════
function emuLedgerTable(entries){
  if(!entries.length) return '<div class="sec-note">No techniques fired yet.</div>';
  return tbl(['TECHNIQUE','TACTIC','SOURCE','STATUS','BLUE VERDICT'], entries.slice().reverse().map(e=>{
    const st=(e.status||'ran'); const sc = st==='error'?'crit':'info';
    const det = e.detected===true?'<span class="pill ok">DETECTED</span>':e.detected===false?'<span class="pill crit">MISS</span>':'<span class="pill muted">pending ingest</span>';
    return `<tr><td><span class="chip att" style="padding:2px 8px">${esc(e.technique_id||'')}</span> <span class="d" style="color:var(--dim)">${esc(e.technique_name||'')}</span></td><td class="d" style="color:var(--dim)">${esc(e.tactic||'')}</td><td>${esc(e.source||'')}</td><td><span class="pill ${sc}">${esc(st.toUpperCase())}</span></td><td>${det}</td></tr>`;
  }).join(''));
}
function emuGate(status, kind){
  const t = kind==='caldera' ? (status&&status.caldera) : (status&&status.atomic);
  if(t && t.available) return {ok:true, banner:''};
  const need = kind==='caldera' ? 'MITRE CALDERA (set CALDERA_URL + CALDERA_API_KEY)' : 'Invoke-AtomicRedTeam (pwsh on PATH + an atomics folder)';
  return {ok:false, banner:`<div class="detstrip" style="background:var(--surface2);margin-bottom:14px"><div class="dh"><span class="eye" style="color:var(--warn)">◆</span> BACKING TOOL NOT AVAILABLE</div><div style="padding:14px 16px" class="sec-note">This module wraps real tooling and will not fake telemetry. Requires ${esc(need)}. &nbsp;Detail: <span style="color:var(--warn)">${esc((t&&t.detail)||'unavailable')}</span>.</div></div>`};
}
function emuStatusSetter(root){
  const sl=root.querySelector('[data-statusline]');
  return (t,run)=>{ if(!sl)return; const dot=sl.querySelector('.sdot'); if(dot) dot.className='sdot '+(run?'run':''); const b=sl.querySelector('b'); if(b){ b.textContent=t; b.style.color=run?'var(--acid)':'var(--dim)'; } };
}

function adGate(status, toolkey, label){
  const t = status && status[toolkey];
  if(t && t.available) return {ok:true, banner:''};
  return {ok:false, banner:`<div class="detstrip" style="background:var(--surface2);margin-bottom:14px"><div class="dh"><span class="eye" style="color:var(--warn)">◆</span> TOOL NOT ON PATH</div><div style="padding:14px 16px" class="sec-note">This module wraps <b style="color:var(--cyan)">${esc(label)}</b> and will not fake it. ${esc((t&&t.detail)||('install '+label))}.</div></div>`};
}
async function adLoadCreds(root){
  const r=await api.get('/api/creds'); const cs=((r&&r.credentials)||[]).filter(c=>['password','ntlm_hash'].includes(c.type));
  const sel=EL(root,'cred'); if(!sel) return cs.length;
  sel.innerHTML = cs.length
    ? cs.map(c=>`<option value="${esc(c.id)}">${esc((c.domain?c.domain+'\\':'')+(c.username||'?'))} · ${esc(c.type)} · ${esc(mask(c.value))}</option>`).join('')
    : '<option value="">— no captured creds (capture in Loot first) —</option>';
  return cs.length;
}

        { term:t, onDone: m=>{ setStatus('COMPLETE',false); const v=(m.results&&m.results[0])||{}; const b=box(root,'res');
            const cls=v.admin?'crit':(v.success?'ok':'muted'); const label=v.admin?'ADMIN (Pwn3d!)':(v.success?'SUCCESS':'FAILED');
            b.innerHTML=`<div class="statusline"><span class="pill ${cls}">${label}</span> <span class="sec-note" style="margin:0">${esc(v.detail||'')} · ${esc(m.method||'')} \u2192 ${esc(m.target||'')}</span></div>`;
            toast('Lateral exec complete', v.success?'ok':'warn'); } }); });
  }
};

// ═══════════════════════════════════════════════════════════════════════════
//  SYNTHETIC C2 BEACON (LCE) — benign detection-validation traffic generator.
//  Emits jittered HTTP(S)/DNS heartbeats to an operator-controlled sink.
// ═══════════════════════════════════════════════════════════════════════════
PANES.c2 = {
  body(){ return (
    detStrip(META.c2)
    + sec('SYNTHETIC C2 BEACON',`
        <div class="detstrip" style="background:var(--surface2);margin-bottom:14px"><div class="dh"><span class="eye" style="color:var(--acid)">◎</span> DETECTION-VALIDATION ONLY</div><div class="sec-note" style="padding:13px 16px;margin:0">Emits benign, jittered heartbeats to a sink <b style="color:var(--acid)">you control</b> — no command channel, no payload, no data transfer. Point it at your canary/listener and confirm your SIEM/IDS flags the beaconing pattern.</div></div>
        <div class="controls" style="margin-bottom:12px">${fld('TRANSPORT',sel('transport',[['https','HTTPS'],['http','HTTP'],['dns','DNS']],'120px'))}${fld('CALLBACK SINK',inp('target','','https://canary.you.net or domain','260px'))}${fld('PROFILE',sel('profile',[['','— loading —']],'220px'))}</div>
        <div class="controls" style="margin-bottom:12px">${fld('INTERVAL (s)',inp('interval','30','','90px'))}${fld('JITTER (%)',inp('jitter','20','','90px'))}${fld('MAX BEACONS (0=∞)',inp('max','0','','140px'))}</div>
        <div class="controls">${btn('▶ START BEACON','go','run')}${btn('■ STOP','stop','stop')}</div>
        ${statusline('IDLE','beacon down')}
        <div data-box="stats" style="margin-top:12px"></div>
        <div class="term" data-term="c2" style="margin-top:14px"><span class="d">// beacon log streams here</span></div>`)
  );},
  async mount(root){
    const setStatus=emuStatusSetter(root); let cid=null; let sent=0,okc=0,err=0;
    const prof=await api.get('/api/c2/profiles'); const ps=(prof&&prof.profiles)||[]; const psel=EL(root,'profile');
    if(psel) psel.innerHTML = ps.length ? ps.map(p=>`<option value="${esc(p.id)}">${esc(p.label)}</option>`).join('') : '<option value="generic">Generic heartbeat</option>';
    const drawStats=(nextS)=>{ const b=box(root,'stats'); if(!b)return;
      b.innerHTML=`<div class="stats">${stat('var(--cyan)',sent,'BEACONS SENT')}${stat('var(--acid)',okc,'OK')}${stat('#ff3b6b',err,'ERR')}${stat('var(--violet)',(nextS!=null?nextS+'s':'—'),'NEXT IN')}</div>`; };
    drawStats(null);
    onAct(root,'stop', async()=>{ if(cid){ await api.post('/api/c2/stop',{client_id:cid}); toast('Beacon stopped','warn'); setStatus('STOPPED',false);} });
    onAct(root,'run', async()=>{ const target=V(root,'target'); if(!target){ toast('Enter a callback sink you control','warn'); return; }
      sent=0;okc=0;err=0; cid='c2_'+Math.random().toString(16).slice(2,10);
      const t=term(root,'c2'); clearTerm(t); termLine(t,'[H3x-Dash] beacon up — heartbeating…','c'); setStatus('BEACONING',true); drawStats(null);
      await api.stream('/api/c2/start',{transport:V(root,'transport'),target,profile:V(root,'profile'),interval_s:parseFloat(V(root,'interval')||'30'),jitter_pct:parseFloat(V(root,'jitter')||'20'),max_beacons:parseInt(V(root,'max')||'0',10),client_id:cid},'/api/c2/stream',
        { term:t,
          onEvent:m=>{ if(m.type==='beacon'){ sent++; if(m.ok)okc++; else err++; drawStats(m.next_s); termLine(t,`  ⟳ #${m.seq} [${m.code}] ${m.detail||''} · next ${m.next_s}s`, m.ok?'a':'w'); } },
          onDone:m=>{ setStatus('STOPPED · '+(m.sent??sent)+' sent',false); toast('Beacon stopped','ok'); } }); });
  }
};

// ── ROADMAP CARD (panes with no backend endpoint in this build) ─────────────
function roadmap(mod){
  const m=META[mod.id]||{};
  const tools=(m.tools||[]).map(t=>`<span class="chip src">${esc(t)}</span>`).join('') || '<span class="d" style="color:var(--muted)">—</span>';
  return detStrip(m)
    + `<section class="sec"><div class="eyebrow"><i></i>NOT WIRED IN THIS BUILD</div>
        <div class="detstrip" style="background:var(--surface2)">
          <div class="dh"><span class="eye" style="color:var(--warn)">◆</span> ROADMAP MODULE — no API endpoint in the current h3x-dash backend</div>
          <div style="padding:15px 16px">
            <div class="sec-note" style="margin:0 0 12px">This pane is part of the console's designed surface but the framework doesn't yet expose a route to drive it. It's shown here as a wiring target rather than faked with dead controls — the panes that <span style="color:var(--acid)">do</span> have endpoints (Scan, Enum, MSF Scanners, Exploit, Validate, Sessions, Loot, Payloads, Spectrum, Coverage) are fully live.</div>
            <div class="dk" style="font-size:8px;letter-spacing:.2em;color:var(--muted);margin-bottom:8px">TOOLS THIS WILL ORCHESTRATE</div>
            <div class="chips">${tools}</div>
          </div>
        </div></section>`;
}

// ═══════════════════════════════════════════════════════════════════════════
//  RENDER
// ═══════════════════════════════════════════════════════════════════════════
function render(){
  (S._streams||[]).forEach(es=>{try{es.close();}catch(e){}}); S._streams=[];
  (S._timers||[]).forEach(t=>clearInterval(t)); S._timers=[];
  renderTabs(); renderSide();
  const w=WS.find(x=>x.id===S.ws)||WS[0];
  const mod=w.modules.find(m=>m.id===S.mod)||w.modules[0];
  const pane=PANES[mod.id];
  const desc=(META[mod.id]||{}).d||'';
  const body = pane ? pane.body(mod) : roadmap(mod);
  wrap.innerHTML =
    `<div class="crumb"><b>${esc(w.label)}</b> &nbsp;/&nbsp; ${esc(mod.label.toUpperCase())}</div>
     <div class="phead"><h1>${esc(mod.icon)}&nbsp;&nbsp;${esc(mod.label)}</h1>${mod.isnew?`<span class="tag-new" style="position:relative;top:-2px">${pane?'NEW MODULE':'ROADMAP'}</span>`:''}</div>
     ${desc?`<div class="pdesc">${esc(desc)}</div>`:''}
     <div class="divider"></div>${body}`;
  if(pane && pane.mount){ Promise.resolve().then(()=>pane.mount(wrap,mod)).catch(err=>{ console.error(err); toast('Panel error: '+err.message,'err'); }); }
  main.scrollTop=0;
}

// ═══════════════════════════════════════════════════════════════════════════
//  BOOT
// ═══════════════════════════════════════════════════════════════════════════
(async function boot(){
  await refreshMsf();
  await refreshHosts();
  // keep the topbar MSF indicator fresh
  S._boot = setInterval(refreshMsf, 15000);
  render();
})();
</script>
</body>
</html>
